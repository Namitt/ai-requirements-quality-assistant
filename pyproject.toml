[project]
name = "ai-requirements-quality-assistant"
version = "0.1.0"
description = "AI-assisted requirements extraction and acceptance-criteria drafting, gated by deterministic validation and human review — a portfolio project"
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "pytest>=8.0,<9.0",
    "anthropic>=0.40,<1.0",
    "google-genai>=1.0,<3.0",
    "fastapi>=0.110,<1.0",
    "uvicorn>=0.29,<1.0",
    "httpx>=0.27,<1.0",
    "streamlit>=1.35,<2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
